<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>睡眠代行サービス</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #fff; overflow: hidden; }
  body {
    font-family: "MS PGothic", "ＭＳ Ｐゴシック", "MS Gothic", "Osaka", "Hiragino Kaku Gothic ProN", sans-serif;
    color: #ff0000;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  .app {
    position: relative;
    max-width: 480px; height: 100dvh; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    background: #fff;
  }

  /* ===== ギザギザ爆発タイトル ===== */
  .burst { position: relative; width: 100%; height: 21dvh; min-height: 130px; flex-shrink: 0; }
  .burst svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .title {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: "HGS創英角ﾎﾟｯﾌﾟ体", "HG創英角ﾎﾟｯﾌﾟ体", "MS PGothic", "Hiragino Kaku Gothic ProN", sans-serif;
    font-weight: 900; font-size: min(10.5vw, 48px); letter-spacing: -0.02em;
    transform: skewX(-6deg) translateY(4%);
  }
  .title span {
    background: linear-gradient(180deg, #ff0000 0%, #ff9900 22%, #ffff00 40%, #00cc00 58%, #0066ff 76%, #9900cc 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 0.6px #7a7a7a;
    filter: drop-shadow(3px 3px 0 #b0b0b0);
  }

  /* ===== 電話 ===== */
  .tel { text-align: center; margin-top: 0.5dvh; line-height: 1.2; }
  .tel .num { font-family: "Arial", "MS PGothic", sans-serif; font-size: min(7.2vw, 32px); }
  .tel .wait { font-size: min(6vw, 26px); }

  /* ===== 雲＋ニコちゃん ===== */
  .scene { position: relative; width: 100%; flex: 1 1 auto; min-height: 0; }
  .cloud { position: absolute; right: 2%; top: 0; width: 76%; height: 78%; }
  .cloud svg { width: 100%; height: 100%; display: block; }
  .cloud p {
    position: absolute; inset: 12% 6% 14% 6%;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: min(4.4vw, 20px); line-height: 1.45; font-weight: bold; white-space: nowrap;
  }
  .smiley { position: absolute; left: 4%; bottom: 0; width: 26%; aspect-ratio: 1; z-index: 2; cursor: pointer; touch-action: manipulation; }
  .smiley svg { width: 100%; height: 100%; display: block; }

  /* ===== 代行依頼ボタン ===== */
  .btn-wrap { width: 100%; padding: 1.5dvh 6% 0; flex-shrink: 0; }
  .irai {
    display: block; width: 100%; height: 13dvh; min-height: 78px;
    border: 2px solid #1f3fbf; border-radius: 22px;
    background: #33ff00;
    color: #ff0000; font-family: inherit; font-weight: bold;
    font-size: min(10vw, 44px); letter-spacing: 0.2em;
    box-shadow: 4px 5px 0 #8a8a8a;
    cursor: pointer; touch-action: manipulation;
    transition: transform 40ms, box-shadow 40ms;
  }
  .irai small { display: block; font-size: 0.32em; letter-spacing: 0.05em; margin-top: 2px; }
  .irai.pressed, .irai:active { transform: translate(4px, 5px); box-shadow: 0 0 0 #8a8a8a; background: #2ee600; }

  .count {
    height: 19dvh; min-height: 110px; flex-shrink: 0; width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #0000ff; line-height: 1.1; padding-bottom: 0.5dvh;
  }
  .count .lbl { font-size: min(6vw, 27px); font-weight: bold; text-decoration: underline wavy #ff00ff; text-underline-offset: 5px; }
  .count .val { font-size: min(9vw, 40px); font-weight: bold; margin-top: 0.8dvh; }
  .count .val b {
    color: #ff0000; font-family: "Arial Black", "Arial", sans-serif; font-size: 2em; margin-right: 4px;
    text-shadow: 3px 3px 0 #ffff00, 5px 5px 0 #8a8a8a;
  }

  .marquee {
    width: 100%; overflow: hidden; white-space: nowrap; background: #ffff00;
    border-top: 1px solid #000; border-bottom: 1px solid #000;
    font-size: min(4vw, 17px); padding: 3px 0; flex-shrink: 0; color: #ff0000;
  }
  .marquee span { display: inline-block; padding-left: 100%; animation: mq 11s linear infinite; }
  @keyframes mq { to { transform: translateX(-100%); } }
  .foot { font-size: 10px; color: #808080; text-align: center; padding: 4px 0 6px; font-family: "MS PGothic", sans-serif; }

  /* ===== 連打時に飛び出す文字 ===== */
  .pop {
    position: fixed; pointer-events: none; z-index: 10; font-weight: bold; white-space: nowrap;
    font-size: min(6vw, 26px); text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff;
    animation: up 900ms ease-out forwards;
  }
  @keyframes up {
    0% { opacity: 1; transform: translate(-50%, 0) scale(.7); }
    20% { transform: translate(-50%, -14px) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -110px) scale(1); }
  }
</style>
</head>
<body>
<div class="app">

  <div class="burst">
    <svg viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true">
      <polygon fill="#ffff00" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="miter"
        points="40,8 108,52 150,12 182,48 232,4 254,46 318,10 312,60 392,58 340,96 398,130 324,136 352,190 270,156 236,196 196,156 140,192 128,150 52,186 76,140 4,150 54,112 2,74 70,72"/>
    </svg>
    <div class="title"><span>睡眠代行サービス</span></div>
  </div>

  <div class="tel">
    <div class="num">TEL：0120-XXX-XXX</div>
    <div class="wait">☎お電話待ってます！！</div>
  </div>

  <div class="scene">
    <div class="cloud">
      <svg viewBox="0 0 300 180" preserveAspectRatio="none" aria-hidden="true">
        <path fill="#33ff00" stroke="#1f3fbf" stroke-width="1.6"
          d="M62,52 C60,22 104,10 124,30 C138,6 184,6 194,30 C212,10 258,18 256,48
             C292,52 300,96 274,112 C296,134 270,170 236,158 C226,182 180,182 168,162
             C150,182 104,180 98,158 C70,176 30,162 38,132 C6,128 2,82 32,76 C22,58 40,44 62,52 Z"/>
      </svg>
      <p>あなたの代わりに<br>プロの睡眠員が眠ります！<br>睡眠時間を<br>別のことに使えます！</p>
    </div>
    <!-- 思考の泡 -->
    <svg style="position:absolute;left:20%;bottom:16%;width:22%;height:24%;overflow:visible;pointer-events:none" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="78" cy="22" r="13" fill="#33ff00" stroke="#1f3fbf" stroke-width="1.4"/>
      <circle cx="50" cy="52" r="9" fill="#33ff00" stroke="#1f3fbf" stroke-width="1.4"/>
      <circle cx="26" cy="76" r="6" fill="#33ff00" stroke="#1f3fbf" stroke-width="1.4"/>
    </svg>
    <div class="smiley" id="smiley">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="47" fill="#ffff00" stroke="#1a1a1a" stroke-width="1.5"/>
        <circle cx="34" cy="38" r="5.5" fill="#9b9b2a" stroke="#1a1a1a" stroke-width="1"/>
        <circle cx="64" cy="38" r="5.5" fill="#9b9b2a" stroke="#1a1a1a" stroke-width="1"/>
        <path d="M26,62 Q50,82 74,60" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
      </svg>
    </div>
  </div>

  <div class="btn-wrap">
    <button class="irai" id="irai" type="button">代行依頼<small>▶▶ここを押してネ◀◀</small></button>
  </div>
  <div class="count"><div class="lbl">本日のあなたの睡眠の代行時間</div><div class="val"><b id="cnt">0</b>時間</div></div>

  <div class="marquee"><span>★無駄な睡眠とおさらば！★　限りある時間を有意義に過ごそう……。　★24時間365日 睡眠員待機中★　初回依頼 無料キャンペーン実施中！！</span></div>
  <div class="foot">Copyright(C) 睡眠代行サービス All Rights Reserved.</div>
</div>

<script>
(function () {
  var btn = document.getElementById('irai');
  var cnt = document.getElementById('cnt');
  var n = 0;
  var words = ['+1時間！', '+1時間！', '依頼受付！', 'Zzz…', '睡眠員出動！', 'おまかせ！', 'ぐーぐー', '受付完了！！'];
  var colors = ['#ff0000', '#0000ff', '#ff00ff', '#00aa00', '#ff6600'];

  function press(x, y) {
    n++;
    cnt.textContent = n;
    var p = document.createElement('div');
    p.className = 'pop';
    p.textContent = words[Math.floor(Math.random() * words.length)];
    p.style.color = colors[Math.floor(Math.random() * colors.length)];
    p.style.left = (x + (Math.random() * 60 - 30)) + 'px';
    p.style.top = (y - 20) + 'px';
    document.body.appendChild(p);
    setTimeout(function () { p.remove(); }, 950);
    btn.classList.add('pressed');
    clearTimeout(btn._t);
    btn._t = setTimeout(function () { btn.classList.remove('pressed'); }, 70);
    try { if (navigator.vibrate) navigator.vibrate(15); } catch (e) {}
  }

  // タッチは pointerdown で即反応（連打の取りこぼし防止・ダブルタップズーム防止）
  btn.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    press(e.clientX, e.clientY);
  });
  btn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      var r = btn.getBoundingClientRect();
      press(r.left + r.width / 2, r.top + r.height / 2);
    }
  });
  // ニコちゃんを押すと代行時間をリセット
  document.getElementById('smiley').addEventListener('pointerdown', function (e) {
    e.preventDefault();
    n = 0;
    cnt.textContent = n;
  });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
